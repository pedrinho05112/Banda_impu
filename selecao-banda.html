<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seleção da Banda — IMPU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #05070a;
    --near-black: #0b0e14;
    --surface: #10141d;
    --surface-2: #151a25;
    --line: rgba(255,255,255,0.14);
    --line-soft: rgba(255,255,255,0.08);
    --blue: #2f6feb;
    --blue-light: #7bb0ff;
    --blue-deep: #0c1c3d;
    --white: #f5f7fa;
    --muted: #a7b0c2;
    --radius: 18px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100dvh;
    background:var(--black);
    color:var(--white);
    font-family:'Manrope', sans-serif;
    display:flex;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    position:relative;
    width:100%;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ============ CAMADA DE FOTO DE FUNDO ============
     Troque as URLs abaixo (no <script>, objeto PHOTOS) pelas
     fotos reais da igreja. Até lá, fica um fundo azulado
     de referência no lugar da foto. */
  .bg-photo{
    position:absolute;
    inset:0;
    z-index:0;
    background-size:cover;
    background-position:center;
    transition:background-image .3s ease;
  }
  .bg-photo.placeholder{
    background-image:
      radial-gradient(120% 70% at 50% -10%, rgba(123,176,255,0.35), transparent 60%),
      radial-gradient(90% 60% at 80% 110%, rgba(47,111,235,0.30), transparent 60%),
      linear-gradient(180deg, #060810 0%, #0a0e18 100%);
  }
  .bg-overlay{
    position:absolute;
    inset:0;
    z-index:1;
    background:
      linear-gradient(180deg, rgba(5,7,10,0.35) 0%, rgba(5,7,10,0.55) 55%, var(--black) 100%);
  }
  .bg-overlay.flat{
    background:var(--black);
  }

  .content{
    position:relative;
    z-index:2;
    flex:1;
    width:100%;
    max-width:460px;
    margin:0 auto;
    padding:28px 24px calc(28px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }

  /* progress: barras */
  .eq{
    display:flex;
    gap:5px;
    align-items:flex-end;
    height:22px;
    margin-bottom:34px;
  }
  .eq i{
    flex:1;
    display:block;
    border-radius:3px;
    background:var(--line);
    height:40%;
    transition:background .35s ease, height .35s ease;
  }
  .eq i.done{ background:var(--blue-deep); height:60%; }
  .eq i.current{
    background:var(--blue);
    height:100%;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .eq i.current{ animation:none; }
  }
  @keyframes pulse{
    0%,100%{ transform:scaleY(1); }
    50%{ transform:scaleY(0.72); }
  }

  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    animation:enter .38s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes enter{
    from{ opacity:0; transform:translateX(14px); }
    to{ opacity:1; transform:translateX(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .screen{ animation:none; }
  }

  /* MARCA IMPU */
  .logo{
    display:inline-flex;
    align-items:center;
    gap:9px;
    margin-bottom:18px;
  }
  .logo-bars{
    display:flex;
    align-items:flex-end;
    gap:2px;
    flex:0 0 auto;
  }
  .logo-bars span{
    display:block;
    width:4px;
    border-radius:2px;
    background:linear-gradient(180deg, var(--blue-light), var(--blue));
  }
  .logo-word{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:.07em;
    color:var(--white);
    line-height:1;
  }
  .logo.lg{ margin-bottom:22px; }
  .logo.lg .logo-bars{ height:32px; }
  .logo.lg .logo-bars span{ width:6px; }
  .logo.lg .logo-word{ font-size:36px; }
  .logo.sm{ margin-bottom:0; }
  .logo.sm .logo-bars{ height:15px; }
  .logo.sm .logo-bars span{ width:3px; }
  .logo.sm .logo-word{ font-size:17px; }

  /* HERO */
  .hero{ justify-content:flex-end; text-align:left; padding-bottom:8px; }

  .kicker{
    font-size:13px;
    color:var(--blue-light);
    margin:0 0 6px;
    letter-spacing:.02em;
    font-weight:600;
  }
  h1.display{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(40px, 11vw, 54px);
    line-height:0.95;
    letter-spacing:.01em;
    margin:0 0 14px;
    color:var(--white);
  }
  h1.display em{
    font-style:normal;
    color:var(--blue-light);
  }
  .lede{
    color:var(--muted);
    font-size:15px;
    line-height:1.55;
    max-width:34ch;
    margin:0 0 30px;
  }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--white);
    background:var(--blue);
    padding:16px 22px;
    border-radius:100px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn:focus-visible{ outline:3px solid var(--blue-light); outline-offset:3px; }
  .btn svg{ width:18px; height:18px; flex:0 0 auto; }

  .btn-ghost{
    background:transparent;
    color:var(--muted);
    font-weight:600;
    font-size:14px;
    padding:10px;
    width:auto;
  }
  .btn-ghost:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }

  /* QUESTION */
  .q-label{
    font-size:13px;
    color:var(--muted);
    margin:0 0 10px;
  }
  .q-text{
    font-size:22px;
    font-weight:800;
    line-height:1.3;
    margin:0 0 26px;
    color:var(--white);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 16px;
    border-radius:14px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.03);
    color:var(--white);
    font-size:16px;
    font-weight:600;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover{ border-color:var(--blue-deep); }
  .opt:active{ transform:scale(.985); }
  .opt:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .opt.selected{
    border-color:var(--blue);
    background:rgba(47,111,235,0.16);
  }
  .pick{
    flex:0 0 auto;
    width:20px; height:20px;
  }
  .pick path{ fill:none; stroke:var(--line); stroke-width:1.6; }
  .opt.selected .pick path{ stroke:var(--blue-light); fill:var(--blue-light); fill-opacity:.2; }

  .q-foot{
    margin-top:auto;
    padding-top:20px;
    display:flex;
    justify-content:flex-start;
  }

  /* RESULT */
  .ticket{
    margin:auto 0;
    border:1px dashed rgba(255,255,255,0.35);
    border-radius:20px;
    padding:26px 22px;
    background:
      radial-gradient(circle at 0 50%, transparent 8px, var(--surface) 8.5px),
      radial-gradient(circle at 100% 50%, transparent 8px, var(--surface) 8.5px),
      linear-gradient(180deg, rgba(47,111,235,0.12), transparent 60%);
    position:relative;
    backdrop-filter:blur(6px);
  }
  .ticket-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .stamp{
    font-family:'Bebas Neue', sans-serif;
    font-size:14px;
    letter-spacing:.12em;
    color:var(--blue-light);
    border:1px solid rgba(123,176,255,0.5);
    display:inline-block;
    padding:5px 10px;
    border-radius:6px;
  }
  .ticket h2{
    font-family:'Bebas Neue', sans-serif;
    font-size:34px;
    line-height:1;
    margin:0 0 10px;
    color:var(--white);
  }
  .ticket p{
    color:var(--muted);
    font-size:15px;
    line-height:1.55;
    margin:0 0 22px;
  }
  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:18px 0;
  }
  .meta-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .meta-row b{ color:var(--white); font-weight:700; }
</style>
</head>
<body>

  <main class="app" id="app" role="main">
    <div class="bg-photo placeholder" id="bgPhoto"></div>
    <div class="bg-overlay" id="bgOverlay"></div>
    <div class="content" id="content">
      <!-- conteúdo injetado via JS -->
    </div>
  </main>

<script>
/* =========================================================
   FOTOS DA IGREJA — coloque aqui os links (ou base64) das
   fotos reais assim que você me enviar. Enquanto estiver
   vazio ("") o site usa o fundo azul de referência.
   ========================================================= */
const PHOTOS = {
  hero: "",       // foto de culto/banda tocando — tela inicial
  aprovado: ""    // foto de louvor/comunhão — tela de aprovação
};

/* =========================================================
   CONFIGURAÇÃO — ajuste aqui quando tiver os critérios finais
   ========================================================= */
const CONFIG = {
  grupoEditalUrl: "https://chat.whatsapp.com/COLOQUE_O_LINK_AQUI",
  aprovar(respostas){
    if (respostas.tempo === "2 meses") return false;
    const exigeSim = ["batizado","comunhao","ritmo","gospel","compromisso","ouvido"];
    return exigeSim.every(k => respostas[k] === "Sim");
  }
};

const QUESTIONS = [
  { id:"instrumento", label:"Sobre você", text:"Qual instrumento você toca?", options:["Baixo","Guitarra","Teclado","Todos"] },
  { id:"batizado", label:"Caminhada com Deus", text:"Você é batizado?", options:["Sim","Não"] },
  { id:"comunhao", label:"Caminhada com Deus", text:"Você está em comunhão com Deus?", options:["Sim","Não"] },
  { id:"tempo", label:"Sobre você", text:"Há quanto tempo você está em nossa congregação?", options:["2 meses","3 meses","Mais de 3 meses"] },
  { id:"ritmo", label:"Perfil musical", text:"Você tem ritmo?", options:["Sim","Não"] },
  { id:"gospel", label:"Perfil musical", text:"Você conhece e sabe tocar músicas gospel de vários estilos?", options:["Sim","Não"] },
  { id:"compromisso", label:"Perfil musical", text:"Você tem compromisso com horários de ensaios e cultos?", options:["Sim","Não"] },
  { id:"ouvido", label:"Perfil musical", text:"Você sabe tocar de ouvido?", options:["Sim","Não"] }
];

function logoMark(size){
  const bars = [55, 100, 72, 42];
  const spans = bars.map(h => `<span style="height:${h}%"></span>`).join("");
  return `<div class="logo ${size}">
    <div class="logo-bars">${spans}</div>
    <span class="logo-word">IMPU</span>
  </div>`;
}

function setBackground(url){
  const bg = document.getElementById("bgPhoto");
  const overlay = document.getElementById("bgOverlay");
  if (url){
    bg.classList.remove("placeholder");
    bg.style.backgroundImage = `url('${url}')`;
    overlay.classList.remove("flat");
  } else {
    bg.classList.add("placeholder");
    bg.style.backgroundImage = "";
    overlay.classList.remove("flat");
  }
}

function setFlatBackground(){
  document.getElementById("bgPhoto").classList.remove("placeholder");
  document.getElementById("bgPhoto").style.backgroundImage = "";
  document.getElementById("bgOverlay").classList.add("flat");
}

let step = -1;
const answers = {};
const content = document.getElementById("content");

function iconPick(){
  return `<svg class="pick" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 2 C4 2 2 8 2 12 C2 16.4 5.6 18 10 18 C14.4 18 18 16.4 18 12 C18 8 16 2 10 2 Z"/>
  </svg>`;
}

function eqBar(){
  let bars = "";
  QUESTIONS.forEach((_, i) => {
    let cls = "";
    if (i < step) cls = "done";
    if (i === step) cls = "current";
    bars += `<i class="${cls}"></i>`;
  });
  return `<div class="eq" aria-hidden="true">${bars}</div>`;
}

function renderHero(){
  setBackground(PHOTOS.hero);
  content.innerHTML = `
    <div class="screen hero">
      ${logoMark("lg")}
      <p class="kicker">Ministério de Louvor</p>
      <h1 class="display">Seleção<br>para a <em>banda</em></h1>
      <p class="lede">Estamos chamando novos músicos para servir com a gente. São só algumas perguntas rápidas — leva menos de 2 minutos.</p>
      <button class="btn" id="startBtn">
        Começar
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="#f5f7fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  `;
  document.getElementById("startBtn").addEventListener("click", () => {
    step = 0;
    renderQuestion();
  });
}

function renderQuestion(){
  setFlatBackground();
  const q = QUESTIONS[step];
  const optsHtml = q.options.map(opt => {
    const selected = answers[q.id] === opt ? "selected" : "";
    return `<button class="opt ${selected}" data-value="${opt}">${iconPick()}<span>${opt}</span></button>`;
  }).join("");

  content.innerHTML = `
    ${eqBar()}
    <div class="screen">
      <p class="q-label">${q.label} · pergunta ${step+1} de ${QUESTIONS.length}</p>
      <h2 class="q-text">${q.text}</h2>
      <div class="options">${optsHtml}</div>
      <div class="q-foot">
        ${step > 0 ? `<button class="btn btn-ghost" id="backBtn">← Voltar</button>` : ""}
      </div>
    </div>
  `;

  content.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      answers[q.id] = btn.dataset.value;
      setTimeout(() => {
        if (step < QUESTIONS.length - 1){
          step++;
          renderQuestion();
        } else {
          renderResult();
        }
      }, 220);
    });
  });

  const backBtn = document.getElementById("backBtn");
  if (backBtn){
    backBtn.addEventListener("click", () => {
      step--;
      if (step < 0) renderHero();
      else renderQuestion();
    });
  }
}

function renderResult(){
  const passou = CONFIG.aprovar(answers);

  if (passou){
    setBackground(PHOTOS.aprovado);
    content.innerHTML = `
      <div class="screen" style="justify-content:center;">
        <div class="ticket">
          <div class="ticket-head">
            ${logoMark("sm")}
            <span class="stamp">Etapa liberada</span>
          </div>
          <h2>Parabéns!</h2>
          <p>Você passou para a última etapa da seleção da banda. Confira o edital e os próximos passos no grupo abaixo.</p>
          <hr class="divider">
          <div class="meta-row"><span>Instrumento</span><b>${answers.instrumento}</b></div>
          <div class="meta-row"><span>Tempo de congregação</span><b>${answers.tempo}</b></div>
        </div>
        <a class="btn" href="${CONFIG.grupoEditalUrl}" target="_blank" rel="noopener" style="margin-top:22px; text-decoration:none;">
          Entrar no grupo do edital
        </a>
      </div>
    `;
  } else {
    setFlatBackground();
    content.innerHTML = `
      <div class="screen" style="justify-content:center;">
        <div class="ticket" style="border-color:var(--line);">
          <div class="ticket-head">
            ${logoMark("sm")}
            <span class="stamp" style="color:var(--muted); border-color:var(--line);">Resultado</span>
          </div>
          <h2>Obrigado por participar!</h2>
          <p>No momento seu perfil ainda não atende a todos os requisitos desta seleção. Continue caminhando conosco — em breve pode ser sua vez.</p>
        </div>
        <button class="btn btn-ghost" id="restartBtn" style="margin-top:18px;">Responder novamente</button>
      </div>
    `;
    document.getElementById("restartBtn").addEventListener("click", () => {
      step = -1;
      for (const k in answers) delete answers[k];
      renderHero();
    });
  }
}

renderHero();
</script>
</body>
</html>
