};

/* =========================================================
   CONFIGURAÇÃO — ajuste aqui quando tiver os critérios finais
   ========================================================= */
const CONFIG = {
  grupoEditalUrl: "https://chat.whatsapp.com/EfucO9HZko862PevZsHT92?mode=gi_t",
  aprovar(respostas){
    if (respostas.tempo === "2 meses") return false;
    const exigeSim = ["batizado","comunhao","ritmo","gospel","compromisso","ouvido"];
    return exigeSim.every(k => respostas[k] === "Sim");
  }
};

const QUESTIONS = [
  { id:"instrumento", label:"Sobre você", text:"Qual instrumento você toca?", options:["Baixo","Guitarra","Teclado","Todos"] },
  { id:"batizado", label:"Caminhada com Deus", text:"Você é batizado?", options:["Sim","Não"] },
  { id:"comunhao", label:"Caminhada com Deus", text:"Você está em comunhão com Deus?", options:["Sim","Não"] },
  { id:"tempo", label:"Sobre você", text:"Há quanto tempo você está em nossa congregação?", options:["2 meses","3 meses","Mais de 3 meses"] },
  { id:"ritmo", label:"Perfil musical", text:"Você tem ritmo?", options:["Sim","Não"] },
  { id:"gospel", label:"Perfil musical", text:"Você conhece e sabe tocar músicas gospel de vários estilos?", options:["Sim","Não"] },
  { id:"compromisso", label:"Perfil musical", text:"Você tem compromisso com horários de ensaios e cultos?", options:["Sim","Não"] },
  { id:"ouvido", label:"Perfil musical", text:"Você sabe tocar de ouvido?", options:["Sim","Não"] }
];

function logoMark(size){
  const bars = [55, 100, 72, 42];
  const spans = bars.map(h => `<span style="height:${h}%"></span>`).join("");
  return `<div class="logo ${size}">
    <div class="logo-bars">${spans}</div>
    <span class="logo-word">IMPU</span>
  </div>`;
}

function setBackground(url){
  const bg = document.getElementById("bgPhoto");
  const overlay = document.getElementById("bgOverlay");
  if (url){
    bg.classList.remove("placeholder");
    bg.style.backgroundImage = `url('${url}')`;
    overlay.classList.remove("flat");
  } else {
    bg.classList.add("placeholder");
    bg.style.backgroundImage = "";
    overlay.classList.remove("flat");
  }
}

function setFlatBackground(){
  document.getElementById("bgPhoto").classList.remove("placeholder");
  document.getElementById("bgPhoto").style.backgroundImage = "";
  document.getElementById("bgOverlay").classList.add("flat");
}

let step = -1;
const answers = {};
const content = document.getElementById("content");

function iconPick(){
  return `<svg class="pick" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 2 C4 2 2 8 2 12 C2 16.4 5.6 18 10 18 C14.4 18 18 16.4 18 12 C18 8 16 2 10 2 Z"/>
  </svg>`;
}

function eqBar(){
  let bars = "";
  QUESTIONS.forEach((_, i) => {
    let cls = "";
    if (i < step) cls = "done";
    if (i === step) cls = "current";
    bars += `<i class="${cls}"></i>`;
  });
  return `<div class="eq" aria-hidden="true">${bars}</div>`;
}

function renderHero(){
  setBackground(PHOTOS.hero);
  content.innerHTML = `
    <div class="screen hero">
      ${logoMark("lg")}
      <p class="kicker">Ministério de Louvor</p>
      <h1 class="display">Seleção<br>para a <em>banda</em></h1>
      <p class="lede">Estamos chamando novos músicos para servir com a gente. São só algumas perguntas rápidas — leva menos de 2 minutos.</p>
      <button class="btn" id="startBtn">
        Começar
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="#f5f7fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  `;
  document.getElementById("startBtn").addEventListener("click", () => {
    step = 0;
    renderQuestion();
  });
}

function renderQuestion(){
  setFlatBackground();
  const q = QUESTIONS[step];
  const optsHtml = q.options.map(opt => {
    const selected = answers[q.id] === opt ? "selected" : "";
    return `<button class="opt ${selected}" data-value="${opt}">${iconPick()}<span>${opt}</span></button>`;
  }).join("");

  content.innerHTML = `
    ${eqBar()}
    <div class="screen">
      <p class="q-label">${q.label} · pergunta ${step+1} de ${QUESTIONS.length}</p>
      <h2 class="q-text">${q.text}</h2>
      <div class="options">${optsHtml}</div>
    </div>
  `;

  content.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      answers[q.id] = btn.dataset.value;
      setTimeout(() => {
        if (step < QUESTIONS.length - 1){
          step++;
          renderQuestion();
        } else {
          renderResult();
        }
      }, 220);
    });
  });

}

function renderResult(){
  const passou = CONFIG.aprovar(answers);

  if (passou){
    setBackground(PHOTOS.aprovado);
    content.innerHTML = `
      <div class="screen" style="justify-content:center;">
        <div class="ticket">
          <div class="ticket-head">
            ${logoMark("sm")}
            <span class="stamp">Etapa liberada</span>
          </div>
          <h2>Parabéns!</h2>
          <p>Você passou para a última etapa da seleção da banda. Confira o edital e os próximos passos no grupo abaixo.</p>
          <hr class="divider">
          <div class="meta-row"><span>Instrumento</span><b>${answers.instrumento}</b></div>
          <div class="meta-row"><span>Tempo de congregação</span><b>${answers.tempo}</b></div>
        </div>
        <a class="btn" href="${CONFIG.grupoEditalUrl}" target="_blank" rel="noopener" style="margin-top:22px; text-decoration:none;">
          Entrar no grupo do edital
        </a>
      </div>
    `;
  } else {
    setFlatBackground();
    content.innerHTML = `
      <div class="screen" style="justify-content:center;">
        <div class="ticket" style="border-color:var(--line);">
          <div class="ticket-head">
            ${logoMark("sm")}
            <span class="stamp" style="color:var(--muted); border-color:var(--line);">Resultado</span>
          </div>
          <h2>Obrigado por participar!</h2>
          <p>No momento seu perfil ainda não atende a todos os requisitos desta seleção. Continue caminhando conosco — em breve pode ser sua vez.</p>
        </div>
      </div>
    `;
  }
}

renderHero();
</script>
</body>
</html>
